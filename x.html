<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Password Generator</title>
    <link rel="stylesheet" type="text/css" href="x.css">
</head>
<body>
    <div class="container">
        <h1><span class="x">Generate a</span><br><span class="a">random password</span></h1>
        <div class="display">
            <input type="text" id="password" placeholder="Password">
            <img src="copy.png">
        </div>
        <div class="display">
            <input type="text" id="password1" placeholder="Password">
            <img src="copy.png">
        </div>
        <div class="display">
            <input type="text" id="password2" placeholder="Password">
            <img src="copy.png">
        </div>
        <div class="display">
            <input type="text" id="password3" placeholder="Password">
            <img src="copy.png">
        </div>
        <button onclick="createPassword()"><img src="generate.png">Generate Password</button>
    </div>

    <script>
        const passwordBox = document.getElementById("password");
        const passwordBox1 = document.getElementById("password1");
        const passwordBox2 = document.getElementById("password2");
        const passwordBox3 = document.getElementById("password3");

        const length = 14;
        const upperCase = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        const lowerCase = "abcdefghijklmnopqrstuvwxyz";
        const number = "1234567890";
        const symbols = "@#$%^&*():><?:";
        const allChars = upperCase + lowerCase + number + symbols;

        function generateRandomPassword() {
            let password = "";
            for (let i = 0; i < length; i++) {
                password += allChars[Math.floor(Math.random() * allChars.length)];
            }
            return password;
        }

        function createPassword() {
            passwordBox.value = generateRandomPassword();
            passwordBox1.value = generateRandomPassword();
            passwordBox2.value = generateRandomPassword();
            passwordBox3.value = generateRandomPassword();
        }
    </script>
</body>
</html>
